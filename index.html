<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio - Clean & Upscale Local</title>
    <style>
        /* CSS Nativo Garantizado para Modo Oscuro */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a !important;
            color: #f1f5f9 !important;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #020617;
            border-bottom: 1px solid #1e293b;
            padding: 1rem;
        }

        .header-container {
            max-width: 80rem;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            font-size: 0.75rem;
            background-color: #022c22;
            color: #6ee7b7;
            border: 1px solid #065f46;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-weight: 500;
        }

        .main-layout {
            flex: 1;
            max-width: 80rem;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 1024px) {
            .main-layout {
                grid-template-columns: 350px 1fr;
            }
        }

        aside {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            max-height: 85vh;
            overflow-y: auto;
        }

        .drop-zone {
            border: 2px dashed #475569;
            background-color: #0f172a;
            border-radius: 0.5rem;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .drop-zone:hover {
            border-color: #6366f1;
        }

        .btn {
            width: 100%;
            padding: 0.625rem;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s, background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-indigo {
            background-color: #4f46e5;
            color: #ffffff;
        }
        .btn-indigo:hover:not(:disabled) {
            background-color: #6366f1;
        }

        .btn-emerald {
            background-color: #059669;
            color: #ffffff;
            margin-top: auto;
        }
        .btn-emerald:hover:not(:disabled) {
            background-color: #10b981;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        hr {
            border: none;
            border-top: 1px solid #334155;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: #818cf8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        select, input[type="range"] {
            width: 100%;
        }

        select {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #ffffff;
            padding: 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            outline: none;
        }

        .info-card {
            background-color: #0f172a;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
        }

        main {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .canvas-container {
            flex: 1;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 400px;
            background-color: #020617;
            background-image: linear-gradient(45deg, #0f172a 25%, transparent 25%),
                              linear-gradient(-45deg, #0f172a 25%, transparent 25%),
                              linear-gradient(45deg, transparent 75%, #0f172a 75%),
                              linear-gradient(-45deg, transparent 75%, #0f172a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        canvas {
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(2, 6, 23, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
            z-index: 10;
        }

        .progress-bg {
            width: 16rem;
            background-color: #1e293b;
            height: 0.5rem;
            border-radius: 9999px;
            overflow: hidden;
            border: 1px solid #334155;
            margin-top: 0.5rem;
        }

        .progress-bar {
            background-color: #6366f1;
            height: 100%;
            width: 0%;
            transition: width 0.2s;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-container">
            <h1 style="font-size: 1.25rem; font-weight: bold; color: white;">
                <span style="color: #818cf8;">✨ AI Studio</span> - Clean & Upscale
            </h1>
            <span class="badge">Procesamiento 100% Local (Gratis)</span>
        </div>
    </header>

    <!-- Layout Principal -->
    <div class="main-layout">

        <!-- Panel Lateral -->
        <aside>
            <div>
                <label style="display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; color: #e2e8f0;">Imagen de Origen</label>
                <div id="dropZone" class="drop-zone">
                    <input type="file" id="fileInput" accept="image/*" class="hidden">
                    <p style="font-size: 0.75rem; color: #94a3b8;">Haz clic o arrastra tu imagen aquí</p>
                    <p style="font-size: 0.625rem; color: #64748b; margin-top: 0.25rem;">Soporta PNG, JPG, WebP</p>
                </div>
            </div>

            <hr>

            <!-- Sección 1 -->
            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <h2 class="section-title">1. Extracción de Sujeto</h2>
                <button id="removeBgBtn" class="btn btn-indigo" disabled>
                    ⚡ Remover Fondo con IA
                </button>
            </div>

            <hr>

            <!-- Sección 2 -->
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <h2 class="section-title">2. Ampliación & Mejora (Upscale)</h2>

                <div>
                    <label style="display: block; font-size: 0.75rem; color: #cbd5e1; margin-bottom: 0.25rem;">Escala de Ampliación:</label>
                    <select id="scaleFactor">
                        <option value="1">Original (1x)</option>
                        <option value="2">2x HD (Doble resolución)</option>
                        <option value="4">4x Ultra HD (Cuádruple resolución)</option>
                    </select>
                </div>

                <div>
                    <div style="display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 0.25rem;">
                        <span style="color: #cbd5e1;">Filtro de Nitidez (Enfoque):</span>
                        <span id="sharpnessVal" style="font-family: monospace; color: #818cf8;">0%</span>
                    </div>
                    <input type="range" id="sharpness" min="0" max="100" value="0">
                </div>
            </div>

            <hr>

            <!-- Info -->
            <div class="info-card">
                <span>Dimensiones:</span>
                <span id="dimInfo" style="font-family: monospace; color: #f1f5f9;">0 x 0 px</span>
            </div>

            <!-- Botón Descargar -->
            <button id="downloadBtn" class="btn btn-emerald" disabled>
                💾 Descargar Imagen Procesada
            </button>
        </aside>

        <!-- Área del Canvas -->
        <main>
            <div class="canvas-container">
                <canvas id="mainCanvas"></canvas>
                <div id="statusContainer" class="overlay">
                    <p id="statusText" style="color: #cbd5e1; font-size: 0.875rem; font-weight: 500;">Carga una imagen para comenzar</p>
                    <div id="progressBarContainer" class="progress-bg hidden">
                        <div id="progressBar" class="progress-bar"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Script Funcional (Módulo IA) -->
    <script type="module">
        import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm";

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const removeBgBtn = document.getElementById('removeBgBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const scaleFactorSelect = document.getElementById('scaleFactor');
        const sharpnessInput = document.getElementById('sharpness');
        const sharpnessVal = document.getElementById('sharpnessVal');
        const dimInfo = document.getElementById('dimInfo');

        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const statusContainer = document.getElementById('statusContainer');
        const statusText = document.getElementById('statusText');
        const progressBarContainer = document.getElementById('progressBarContainer');
        const progressBar = document.getElementById('progressBar');

        let rawImage = null;
        let cleanImage = null;

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#6366f1'; });
        dropZone.addEventListener('dragleave', () => dropZone.style.borderColor = '#475569');
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#475569';
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    rawImage = img;
                    cleanImage = img;
                    removeBgBtn.disabled = false;
                    downloadBtn.disabled = false;
                    statusContainer.classList.add('hidden');
                    renderPipeline();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        removeBgBtn.addEventListener('click', async () => {
            if (!rawImage) return;

            statusContainer.classList.remove('hidden');
            progressBarContainer.classList.remove('hidden');
            progressBar.style.width = '0%';
            statusText.innerText = "Descargando modelo de IA...";
            removeBgBtn.disabled = true;

            try {
                const blob = await removeBackground(rawImage.src, {
                    model: 'small',
                    fetchArgs: { mode: 'cors' },
                    progress: (key, current, total) => {
                        if (total) {
                            const percent = Math.round((current / total) * 100);
                            progressBar.style.width = `${percent}%`;
                            statusText.innerText = `Cargando IA (${key}): ${percent}%`;
                        } else {
                            statusText.innerText = `Procesando imagen...`;
                        }
                    }
                });

                const url = URL.createObjectURL(blob);
                const cleanedImg = new Image();
                cleanedImg.onload = () => {
                    cleanImage = cleanedImg;
                    statusContainer.classList.add('hidden');
                    progressBarContainer.classList.add('hidden');
                    removeBgBtn.disabled = false;
                    renderPipeline();
                };
                cleanedImg.src = url;
            } catch (err) {
                console.error("Error:", err);
                statusText.innerText = "❌ Error al procesar la imagen.";
                progressBarContainer.classList.add('hidden');
                removeBgBtn.disabled = false;
            }
        });

        scaleFactorSelect.addEventListener('change', renderPipeline);
        sharpnessInput.addEventListener('input', () => {
            sharpnessVal.innerText = sharpnessInput.value + '%';
            renderPipeline();
        });

        function renderPipeline() {
            const baseImg = cleanImage || rawImage;
            if (!baseImg) return;

            const scale = parseInt(scaleFactorSelect.value);
            const targetWidth = baseImg.width * scale;
            const targetHeight = baseImg.height * scale;

            dimInfo.innerText = `${targetWidth} x ${targetHeight} px (${scale}x)`;

            canvas.width = targetWidth;
            canvas.height = targetHeight;

            ctx.clearRect(0, 0, targetWidth, targetHeight);
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(baseImg, 0, 0, targetWidth, targetHeight);

            const sharpnessAmount = parseInt(sharpnessInput.value) / 100;
            if (sharpnessAmount > 0) {
                applyUnsharpMask(ctx, targetWidth, targetHeight, sharpnessAmount);
            }
        }

        function applyUnsharpMask(context, width, height, amount) {
            const imageData = context.getImageData(0, 0, width, height);
            const data = imageData.data;
            const copy = new Uint8ClampedArray(data);

            const kernel = [
                0, -1, 0,
               -1,  5, -1,
                0, -1, 0
            ];

            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    const idx = (y * width + x) * 4;
                    if (data[idx + 3] === 0) continue;

                    for (let c = 0; c < 3; c++) {
                        let res = 0;
                        let kIdx = 0;
                        for (let ky = -1; ky <= 1; ky++) {
                            for (let kx = -1; kx <= 1; kx++) {
                                const nIdx = ((y + ky) * width + (x + kx)) * 4;
                                res += copy[nIdx + c] * kernel[kIdx++];
                            }
                        }
                        const original = copy[idx + c];
                        const sharpened = Math.min(255, Math.max(0, res));
                        data[idx + c] = original + (sharpened - original) * amount;
                    }
                }
            }
            context.putImageData(imageData, 0, 0);
        }

        downloadBtn.addEventListener('click', () => {
            if (!rawImage) return;
            const link = document.createElement('a');
            link.download = 'imagen-sin-fondo-hd.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
