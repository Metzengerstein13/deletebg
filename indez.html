<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio - Clean & Upscale Local</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .checkerboard {
            background-color: #0f172a;
            background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%),
                              linear-gradient(-45deg, #1e293b 25%, transparent 25%),
                              linear-gradient(45deg, transparent 75%, #1e293b 75%),
                              linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Encabezado -->
    <header class="border-b border-slate-800 bg-slate-950 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                <span class="text-indigo-500">✨ AI Studio</span> - Clean & Upscale
            </h1>
            <span class="text-xs bg-emerald-950 text-emerald-300 border border-emerald-800 px-2.5 py-1 rounded-full font-medium">
                Procesamiento 100% Local (Gratis)
            </span>
        </div>
    </header>

    <!-- Layout Principal -->
    <div class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Panel de Ajustes -->
        <aside class="lg:col-span-4 bg-slate-800 border border-slate-700 rounded-xl p-5 flex flex-col gap-5 overflow-y-auto max-h-[85vh]">

            <!-- Carga de Imagen -->
            <div>
                <label class="block text-sm font-semibold mb-2">Imagen de Origen</label>
                <div id="dropZone" class="border-2 border-dashed border-slate-600 hover:border-indigo-500 bg-slate-900/50 rounded-lg p-4 text-center cursor-pointer transition">
                    <input type="file" id="fileInput" accept="image/*" class="hidden">
                    <p class="text-xs text-slate-400">Haz clic o arrastra tu imagen aquí</p>
                    <p class="text-[10px] text-slate-500 mt-1">Soporta PNG, JPG, WebP</p>
                </div>
            </div>

            <hr class="border-slate-700">

            <!-- Fase 1: Fondo -->
            <div class="space-y-3">
                <h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider">1. Extracción de Sujeto</h2>
                <button id="removeBgBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg text-xs transition flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    ⚡ Remover Fondo con IA
                </button>
            </div>

            <hr class="border-slate-700">

            <!-- Fase 2: Escalado & Nitidez -->
            <div class="space-y-4">
                <h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider">2. Ampliación & Mejora (Upscale)</h2>

                <div>
                    <label class="block text-xs text-slate-300 mb-1">Escala de Ampliación:</label>
                    <select id="scaleFactor" class="w-full bg-slate-900 border border-slate-700 text-xs rounded p-2 text-white accent-indigo-500">
                        <option value="1">Original (1x)</option>
                        <option value="2">2x HD (Doble resolución)</option>
                        <option value="4">4x Ultra HD (Cuádruple resolución)</option>
                    </select>
                </div>

                <div>
                    <div class="flex justify-between text-xs mb-1">
                        <label>Filtro de Nitidez (Enfoque):</label>
                        <span id="sharpnessVal" class="font-mono text-indigo-400">0%</span>
                    </div>
                    <input type="range" id="sharpness" min="0" max="100" value="0" class="w-full accent-indigo-500">
                </div>
            </div>

            <hr class="border-slate-700">

            <!-- Información de Resolución -->
            <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700 text-xs space-y-1">
                <div class="flex justify-between text-slate-400">
                    <span>Dimensiones:</span>
                    <span id="dimInfo" class="font-mono text-slate-200">0 x 0 px</span>
                </div>
            </div>

            <!-- Exportar -->
            <button id="downloadBtn" class="mt-auto bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg text-xs transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                💾 Descargar Imagen Procesada
            </button>
        </aside>

        <!-- Área de Vista Previa -->
        <main class="lg:col-span-8 flex flex-col gap-4">
            <div class="flex-1 bg-slate-950 border border-slate-800 rounded-xl overflow-hidden flex items-center justify-center relative min-h-[400px] checkerboard">
                <canvas id="mainCanvas" class="max-w-full max-h-[75vh] object-contain shadow-2xl"></canvas>
                <div id="statusContainer" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-10">
                    <p id="statusText" class="text-slate-300 text-sm font-medium mb-2">Carga una imagen para comenzar</p>
                    <div id="progressBarContainer" class="w-64 bg-slate-800 h-2 rounded-full overflow-hidden hidden border border-slate-700">
                        <div id="progressBar" class="bg-indigo-500 h-full w-0 transition-all duration-200"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Módulo JS de Importación Directa ESM -->
    <script type="module">
        import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm";

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const removeBgBtn = document.getElementById('removeBgBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const scaleFactorSelect = document.getElementById('scaleFactor');
        const sharpnessInput = document.getElementById('sharpness');
        const sharpnessVal = document.getElementById('sharpnessVal');
        const dimInfo = document.getElementById('dimInfo');

        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const statusContainer = document.getElementById('statusContainer');
        const statusText = document.getElementById('statusText');
        const progressBarContainer = document.getElementById('progressBarContainer');
        const progressBar = document.getElementById('progressBar');

        let rawImage = null;
        let cleanImage = null;

        // Carga de archivo
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-indigo-500'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-indigo-500'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-500');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    rawImage = img;
                    cleanImage = img;
                    removeBgBtn.disabled = false;
                    downloadBtn.disabled = false;
                    statusContainer.classList.add('hidden');
                    renderPipeline();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Extracción de fondo
        removeBgBtn.addEventListener('click', async () => {
            if (!rawImage) return;

            statusContainer.classList.remove('hidden');
            progressBarContainer.classList.remove('hidden');
            progressBar.style.width = '0%';
            statusText.innerText = "Descargando modelo de IA e iniciando procesamiento local...";
            removeBgBtn.disabled = true;

            try {
                // Ejecución con seguimiento de progreso
                // CÓDIGO AJUSTADO PARA GITHUB PAGES

            const blob = await removeBackground(rawImage.src, {
                model: 'small',
                publicPath: "https://cdn.jsdelivr.net/npm/@imgly/background-removal-data@1.5.5/dist/",
                progress: (key, current, total) => {
                    if (total) {
                        const percent = Math.round((current / total) * 100);
                        progressBar.style.width = `${percent}%`;
                        statusText.innerText = `Cargando IA (${key}): ${percent}%`;
                    }
                }
            });

                const url = URL.createObjectURL(blob);
                const cleanedImg = new Image();
                cleanedImg.onload = () => {
                    cleanImage = cleanedImg;
                    statusContainer.classList.add('hidden');
                    progressBarContainer.classList.add('hidden');
                    removeBgBtn.disabled = false;
                    renderPipeline();
                };
                cleanedImg.src = url;
            } catch (err) {
                console.error("Error al procesar:", err);
                statusText.innerText = "❌ No se pudo procesar la imagen. Si estás abriendo el HTML localmente, asegúrate de usar un servidor local (ej. Live Server).";
                progressBarContainer.classList.add('hidden');
                removeBgBtn.disabled = false;
            }
        });

        // Eventos
        scaleFactorSelect.addEventListener('change', renderPipeline);
        sharpnessInput.addEventListener('input', () => {
            sharpnessVal.innerText = sharpnessInput.value + '%';
            renderPipeline();
        });

        function renderPipeline() {
            const baseImg = cleanImage || rawImage;
            if (!baseImg) return;

            const scale = parseInt(scaleFactorSelect.value);
            const targetWidth = baseImg.width * scale;
            const targetHeight = baseImg.height * scale;

            dimInfo.innerText = `${targetWidth} x ${targetHeight} px (${scale}x)`;

            canvas.width = targetWidth;
            canvas.height = targetHeight;

            ctx.clearRect(0, 0, targetWidth, targetHeight);
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(baseImg, 0, 0, targetWidth, targetHeight);

            const sharpnessAmount = parseInt(sharpnessInput.value) / 100;
            if (sharpnessAmount > 0) {
                applyUnsharpMask(ctx, targetWidth, targetHeight, sharpnessAmount);
            }
        }

        function applyUnsharpMask(context, width, height, amount) {
            const imageData = context.getImageData(0, 0, width, height);
            const data = imageData.data;
            const copy = new Uint8ClampedArray(data);

            const kernel = [
                0, -1, 0,
               -1,  5, -1,
                0, -1, 0
            ];

            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    const idx = (y * width + x) * 4;
                    if (data[idx + 3] === 0) continue;

                    for (let c = 0; c < 3; c++) {
                        let res = 0;
                        let kIdx = 0;
                        for (let ky = -1; ky <= 1; ky++) {
                            for (let kx = -1; kx <= 1; kx++) {
                                const nIdx = ((y + ky) * width + (x + kx)) * 4;
                                res += copy[nIdx + c] * kernel[kIdx++];
                            }
                        }
                        const original = copy[idx + c];
                        const sharpened = Math.min(255, Math.max(0, res));
                        data[idx + c] = original + (sharpened - original) * amount;
                    }
                }
            }
            context.putImageData(imageData, 0, 0);
        }

        downloadBtn.addEventListener('click', () => {
            if (!rawImage) return;
            const link = document.createElement('a');
            link.download = 'imagen-sin-fondo-hd.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
